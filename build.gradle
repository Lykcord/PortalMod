plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/portalmod.accesswidener')

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }

        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run-server')
        }

        datagen {
            client()
            setConfigName('Fabric Datagen')
            ideConfigGenerated(true)
            runDir('run-datagen')
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file('build/generated/fabric-datagen')}")
            vmArg("-Dfabric-api.datagen.modid=${mod_id}")
        }
    }
}

sourceSets {
    main {
        java {
            setSrcDirs(['src/fabric/java'])
        }
        resources {
            setSrcDirs(['src/main/resources', 'src/generated/resources'])
            exclude 'META-INF/mods.toml'
            exclude 'META-INF/accesstransformer.cfg'
            exclude 'portalmod.mixins.json'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Dev-runtime only: Sodium in the run config from Milestone 2 onward so portal-view
    // compatibility is tested continuously rather than retrofitted (Indium is obsolete on
    // modern Sodium, which implements FRAPI natively).
    localRuntime "maven.modrinth:sodium:mc26.1.2-0.8.12-fabric"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'loader_version', loader_version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_version: minecraft_version,
                loader_version: loader_version,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_license: mod_license,
                mod_authors: mod_authors,
                mod_description: mod_description
        )
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    from('LICENSE.md') {
        rename { "${it}_${mod_id}" }
    }
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = 'portalmod'
    versionNumber = "${mod_version}-fabric-${minecraft_version}"
    versionType = 'alpha'
    uploadFile = tasks.named('jar')
    gameVersions = [minecraft_version]
    loaders = ['fabric']
    changelog = rootProject.file('CHANGELOG_LATEST.md').exists()
            ? rootProject.file('CHANGELOG_LATEST.md').text
            : 'Fabric modernization build.'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}
