plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'eclipse'
    id 'idea'
    id 'com.modrinth.minotaur' version '2.+'
    id 'io.github.themrmilchmann.curseforge-publish' version '0.6.1'
}

version = mod_version
group = mod_group_id
base.archivesName = 'portalmod'

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'portalmod_test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
    configureDataGeneration {
        client = true
        outputDirectory = file('src/generated/resources')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly 'maven.modrinth:sodium:mc26.3-0.9.2-fabric'
    // Optional compatibility test profile.
    if (project.hasProperty('performanceMods')) {
        localRuntime 'maven.modrinth:sodium:mc26.3-0.9.2-fabric'
        localRuntime 'maven.modrinth:lithium:mc26.3-0.26.2-fabric'
        localRuntime 'maven.modrinth:ferrite-core:9.0.0-fabric'
        localRuntime 'maven.modrinth:immediatelyfast:1.17.1+26.3-fabric'
        localRuntime 'maven.modrinth:entityculling:X1g3VhTx'
    }
    implementation include('com.electronwill.night-config:core:3.8.3')
    implementation include('com.electronwill.night-config:toml:3.8.3')
    testImplementation 'junit:junit:4.13.2'
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('processResources', ProcessResources) {
    exclude 'META-INF/mods.toml', 'META-INF/accesstransformer.cfg'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = 'portalmod'
    versionNumber = mod_version
    versionType = 'release'
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ['fabric']
    changelog = rootProject.file('CHANGELOG.md').text
    dependencies {
        required.project 'fabric-api'
    }
}

curseforge {
    apiToken = System.getenv('CURSEFORGE_TOKEN')
    publications {
        register('curseForge') {
            projectId = '517296'
            artifacts.register('main') {
                displayName = mod_version
                changelog {
                    format = ChangelogFormat.MARKDOWN
                    from(file('CHANGELOG.md'))
                }
                from(tasks.named('jar'))
            }
        }
    }
}

// Export the creative review world after the client tests.
if (project.hasProperty('reviewWorld')) {
    loom.runs.named('clientGameTest') {
        vmArg "-Dportalmod.reviewWorldOutput=${file('run-review/saves/PortalMod 26.3 Review').absolutePath}"
    }
}

if (project.hasProperty('walkCapture')) {
    loom.runs.named('clientGameTest') {
        vmArg "-Dportalmod.walkCaptureOutput=${file('build/reports/portal-walk/' + (project.hasProperty('performanceMods') ? 'performance' : 'vanilla')).absolutePath}"
        if (project.hasProperty('walkCaptureDepth')) {
            vmArg "-Dportalmod.walkCaptureDepth=${project.property('walkCaptureDepth')}"
        }
        if (project.hasProperty('walkCaptureFov')) {
            vmArg "-Dportalmod.walkCaptureFov=${project.property('walkCaptureFov')}"
        }
    }
}

if (project.hasProperty('antlineMemory')) {
    loom.runs.named('clientGameTest') {
        vmArg '-Dportalmod.antlineMemory=true'
        vmArg "-Dportalmod.antlineMemoryPower=${project.findProperty('antlineMemoryPower') ?: 'button'}"
        vmArg '-Xmx1G'
        vmArg "-Dportalmod.antlineMemoryOutput=${file('build/reports/antline-memory/' + (project.hasProperty('performanceMods') ? 'performance' : 'vanilla') + '-' + (project.findProperty('antlineMemoryPower') ?: 'button')).absolutePath}"
    }
}

// Select client tests without editing the source manifest.
tasks.named('processGametestResources') {
    inputs.property('clientTest', project.findProperty('clientTest') ?: '')
    doLast {
        def selection = project.findProperty('clientTest')
        if (selection) {
            def manifest = file("${destinationDir}/fabric.mod.json")
            def metadata = new groovy.json.JsonSlurper().parseText(manifest.text)
            def requestedTests = selection.toString().split(',').collect { it.trim() }
            def selectedTests = metadata.entrypoints['fabric-client-gametest'].findAll { entrypoint ->
                requestedTests.any { testName -> testName == entrypoint || entrypoint.endsWith('.' + testName) }
            }
            if (selectedTests.size() != requestedTests.size()) {
                throw new GradleException("Unknown or ambiguous client test: ${selection}")
            }
            metadata.entrypoints['fabric-client-gametest'] = selectedTests
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
        }
    }
}
