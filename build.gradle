plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'eclipse'
    id 'idea'
    id 'com.modrinth.minotaur' version '2.+'
    id 'io.github.themrmilchmann.curseforge-publish' version '0.6.1'
}

version = mod_version
group = mod_group_id
base.archivesName = 'portalmod'

repositories {
    mavenCentral()
}

sourceSets.main.resources.srcDir 'src/generated/resources'

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'portalmod_test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
    configureDataGeneration {
        client = true
        outputDirectory = file('src/generated/resources')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation include('com.electronwill.night-config:core:3.8.3')
    implementation include('com.electronwill.night-config:toml:3.8.3')
    testImplementation 'junit:junit:4.13.2'
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('processResources', ProcessResources) {
    exclude 'META-INF/mods.toml', 'META-INF/accesstransformer.cfg'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = 'portalmod'
    versionNumber = mod_version
    versionType = 'release'
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ['fabric']
    changelog = rootProject.file('CHANGELOG_LATEST.md').text
    dependencies {
        required.project 'fabric-api'
    }
}

curseforge {
    apiToken = System.getenv('CURSEFORGE_TOKEN')
    publications {
        register('curseForge') {
            projectId = '517296'
            artifacts.register('main') {
                displayName = mod_version
                changelog {
                    format = ChangelogFormat.MARKDOWN
                    from(file('CHANGELOG_LATEST.md'))
                }
                from(tasks.named('jar'))
            }
        }
    }
}
