name: Fabric

on:
  push:
    branches:
      - master
      - main
      - 'codex/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: ./gradlew build

      - name: Run datagen
        run: ./gradlew runDatagen

      - name: Headless server smoke test
        run: timeout 90s ./gradlew runServer --args="--nogui" || test $? -eq 124
